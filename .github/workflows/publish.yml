# Publishes exact tarballs prepared from a stable GitHub release tag.
# Authentication is npm trusted-publisher OIDC only; no token fallback exists.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      manifest-digest: ${{ steps.manifest-digest.outputs.manifest-digest }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Fetch the protected release branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Configure approved release signers
        shell: bash
        run: |
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          umask 077
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # The reviewed npm release is the only dependency of this job that npm ci
      # cannot integrity-check, so pin its tarball digest here and install the
      # exact bytes that were verified rather than a version the registry
      # resolves at run time. NPM_VERSION must stay equal to the root
      # packageManager pin, and NPM_INTEGRITY must be updated with it
      # (npm view npm@<version> dist.integrity).
      - name: Use the reviewed npm release
        shell: bash
        env:
          NPM_VERSION: 11.18.0
          NPM_INTEGRITY: sha512-T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
        run: |
          tarball="${RUNNER_TEMP}/npm-${NPM_VERSION}.tgz"
          curl --fail --silent --show-error --location \
            --output "${tarball}" \
            "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz"
          integrity="sha512-$(openssl dgst -sha512 -binary "${tarball}" | openssl base64 -A)"
          if [[ "${integrity}" != "${NPM_INTEGRITY}" ]]; then
            echo "::error::npm@${NPM_VERSION} tarball integrity ${integrity} does not match the reviewed digest"
            exit 1
          fi
          npm install --global "${tarball}"
          installed="$(npm --version)"
          if [[ "${installed}" != "${NPM_VERSION}" ]]; then
            echo "::error::expected npm ${NPM_VERSION} on PATH but found ${installed}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Prepare and verify release tarballs
        run: npm run release:pack -- -- --require-clean --require-main-ancestor --require-release-tag --expected-release-commit "${RELEASE_COMMIT}" --output .release

      # package-manifest.json carries the SHA-1 and SHA-512 of every prepared
      # tarball, and it travels inside the artifact it describes. Pinning its
      # digest as a job output — which a later job cannot rewrite — gives the
      # publisher a comparison value that does not come from the artifact.
      - name: Pin the prepared manifest digest
        id: manifest-digest
        shell: bash
        run: |
          digest="$(sha256sum .release/package-manifest.json | cut -d " " -f 1)"
          printf 'manifest-digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
          printf 'Prepared manifest SHA-256 %s\n' "${digest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the prepared release
        id: upload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: logger-release-${{ github.run_id }}
          path: .release/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 30

      - name: Record the prepared artifact digest
        run: echo "Prepared artifact SHA-256 ${{ steps.upload.outputs.artifact-digest }}" >> "${GITHUB_STEP_SUMMARY}"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up Node.js and the npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: logger-release-${{ github.run_id }}
          path: .release

      - name: Verify the downloaded manifest against the prepare job
        shell: bash
        env:
          EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest-digest }}
        run: |
          if [[ ! "${EXPECTED_MANIFEST_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the prepare job did not pin a prepared manifest digest"
            exit 1
          fi
          printf '%s  %s\n' "${EXPECTED_MANIFEST_DIGEST}" .release/package-manifest.json |
            sha256sum --check --strict --quiet

      - name: Publish verified prepared tarballs
        run: npm run release:publish -- -- --expected-release-commit "${RELEASE_COMMIT}" --manifest .release/package-manifest.json
